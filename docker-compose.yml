name: kamada

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kamada
      POSTGRES_USER: ${POSTGRES_USER:-kamada}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kamada_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/Kamada.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Kamada: Host=postgres;Port=5432;Database=kamada;Username=${POSTGRES_USER:-kamada};Password=${POSTGRES_PASSWORD:-kamada_dev};Gss Encryption Mode=Disable
      RouteOptimization__MatrixProvider: ${ROUTE_MATRIX_PROVIDER:-Osrm}
      RouteOptimization__Osrm__BaseUrl: ${OSRM_BASE_URL:-https://router.project-osrm.org/}
      RouteOptimization__Osrm__MinDelayBetweenRequests: ${OSRM_MIN_DELAY:-00:00:01}
      RouteOptimization__Google__ApiKey: ${GOOGLE_ROUTES_API_KEY:-}
      # Order assistant (local AI): enable together with the "ai" profile, see README "AI order assistant".
      Assistant__Enabled: ${ASSISTANT_ENABLED:-false}
      Assistant__Ollama__BaseUrl: ${OLLAMA_BASE_URL:-http://ollama:11434/}
      Assistant__Ollama__Model: ${OLLAMA_MODEL:-gemma3:4b}
      Assistant__Whisper__Model: ${WHISPER_MODEL:-small}
      Assistant__Whisper__ModelPath: /app/models/ggml-${WHISPER_MODEL:-small}.bin
    ports:
      - "5080:8080"
    volumes:
      # Speech model (downloaded on the first start with the assistant enabled).
      - whisper-models:/app/models
    depends_on:
      postgres:
        condition: service_healthy

  admin:
    build:
      context: .
      dockerfile: src/Web/Kamada.AdminPanel/Dockerfile
    environment:
      # Address of the API as seen from the user's browser.
      API_BASE_URL: ${PUBLIC_API_URL:-http://localhost:5080/}
    ports:
      - "5081:80"
    depends_on:
      - api

  mobile:
    build:
      context: .
      dockerfile: src/Web/Kamada.MobileApp/Dockerfile
    environment:
      API_BASE_URL: ${PUBLIC_API_URL:-http://localhost:5080/}
    ports:
      - "5082:80"
    volumes:
      - assistant-models:/usr/share/nginx/html/models:ro
    depends_on:
      - api

  # Optional self-hosted OSRM (docker compose --profile osrm up), see README "Self-hosted OSRM".
  # First start downloads the OSM extract and preprocesses it (a few minutes); later starts reuse the volume.
  osrm-download:
    image: debian:trixie-slim
    profiles: [osrm]
    environment:
      OSRM_REGIONS: ${OSRM_REGIONS:-pomorskie zachodniopomorskie wielkopolskie kujawsko-pomorskie}
      OSRM_GEOFABRIK_URL: ${OSRM_GEOFABRIK_URL:-https://download.geofabrik.de/europe/poland}
    entrypoint: ["/bin/sh", "/scripts/download.sh"]
    volumes:
      - osrm-data:/data
      - ./deploy/osrm:/scripts:ro

  osrm-prepare:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    profiles: [osrm]
    entrypoint: ["/bin/sh", "/scripts/prepare.sh"]
    volumes:
      - osrm-data:/data
      - ./deploy/osrm:/scripts:ro
    depends_on:
      osrm-download:
        condition: service_completed_successfully

  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    profiles: [osrm]
    command: ["osrm-routed", "--algorithm", "mld", "--max-table-size", "1000", "/data/region.osrm"]
    ports:
      - "5000:5000"
    volumes:
      - osrm-data:/data
    depends_on:
      osrm-prepare:
        condition: service_completed_successfully

  # Optional local language model for the order assistant (docker compose --profile ai up, ASSISTANT_ENABLED=true).
  # CPU only by default; uncomment the "deploy" block to use an NVIDIA GPU (needs the NVIDIA Container Toolkit).
  ollama:
    image: ollama/ollama:0.34.1
    profiles: [ai]
    environment:
      # Keep the model in memory between orders (loading it takes tens of seconds on a CPU).
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # One-shot: downloads the configured model into the volume (first start only, ~3 GB for gemma3:4b).
  ollama-pull:
    image: ollama/ollama:0.34.1
    profiles: [ai]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-gemma3:4b}"]
    depends_on:
      ollama:
        condition: service_healthy

  # Optional models for the on-device assistant (docker compose --profile assistant up assistant-models), served by the
  # phone app under /models. First run downloads them (~1.6 GB for the defaults); later runs reuse the volume.
  assistant-models:
    image: debian:trixie-slim
    profiles: [assistant]
    environment:
      ASSISTANT_MODELS: ${ASSISTANT_DEVICE_MODELS:-Qwen3-1.7B-q4f16_1-MLC Qwen3-0.6B-q4f16_1-MLC onnx-community/whisper-base onnx-community/whisper-tiny}
    entrypoint: ["/bin/sh", "-c", "apt-get update -qq && apt-get install -y -qq --no-install-recommends curl ca-certificates >/dev/null && exec sh /scripts/fetch-models.sh /models"]
    volumes:
      - assistant-models:/models
      - ./deploy/assistant:/scripts:ro

volumes:
  postgres-data:
  osrm-data:
  ollama-data:
  whisper-models:
  assistant-models:
