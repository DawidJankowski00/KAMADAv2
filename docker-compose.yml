name: kamada

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kamada
      POSTGRES_USER: ${POSTGRES_USER:-kamada}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kamada_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/Kamada.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Kamada: Host=postgres;Port=5432;Database=kamada;Username=${POSTGRES_USER:-kamada};Password=${POSTGRES_PASSWORD:-kamada_dev};Gss Encryption Mode=Disable
      RouteOptimization__MatrixProvider: ${ROUTE_MATRIX_PROVIDER:-Osrm}
      RouteOptimization__Osrm__BaseUrl: ${OSRM_BASE_URL:-https://router.project-osrm.org/}
      RouteOptimization__Google__ApiKey: ${GOOGLE_ROUTES_API_KEY:-}
    ports:
      - "5080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  admin:
    build:
      context: .
      dockerfile: src/Web/Kamada.AdminPanel/Dockerfile
    environment:
      # Address of the API as seen from the user's browser.
      API_BASE_URL: ${PUBLIC_API_URL:-http://localhost:5080/}
    ports:
      - "5081:80"
    depends_on:
      - api

  courier:
    build:
      context: .
      dockerfile: src/Web/Kamada.CourierApp/Dockerfile
    environment:
      API_BASE_URL: ${PUBLIC_API_URL:-http://localhost:5080/}
    ports:
      - "5082:80"
    depends_on:
      - api

volumes:
  postgres-data:
