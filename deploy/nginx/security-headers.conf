# Security headers of the web apps. Included by spa.conf in the server block and in every location that sets its own
# headers (nginx drops inherited add_header directives in a location that has any). Regenerated at container start by
# 40-kamada-config.sh with the API origin and the hashes of the inline scripts; this copy is the fallback.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
# The origin is sent to other sites (OpenStreetMap's tile servers ask for a Referer), never the path.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), geolocation=(), payment=(), microphone=(self)" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://tile.openstreetmap.org https://cdn.jsdelivr.net; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
