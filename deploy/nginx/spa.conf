# Static hosting for the Blazor WebAssembly frontends.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # No nginx version in error pages and the Server header.
    server_tokens off;

    # Security headers and CSP (generated at container start, see 40-kamada-config.sh). A location that adds its own
    # headers must include the file again: nginx does not inherit add_header into it.
    include /etc/nginx/kamada/security-headers.conf;

    # Blazor publish output is pre-compressed (.gz); serve it directly.
    gzip_static on;
    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

    # Client-side routing: unknown paths fall back to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Files that change on deploy/configuration must never be cached by the browser.
    location = /index.html { include /etc/nginx/kamada/security-headers.conf; add_header Cache-Control "no-cache"; }
    location = /appsettings.json { include /etc/nginx/kamada/security-headers.conf; add_header Cache-Control "no-cache"; }

    # Fingerprinted framework files can be cached forever.
    location /_framework/ {
        include /etc/nginx/kamada/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
