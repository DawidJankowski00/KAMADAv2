# Static hosting for the Blazor WebAssembly frontends.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Blazor publish output is pre-compressed (.gz); serve it directly.
    gzip_static on;
    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

    # Client-side routing: unknown paths fall back to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Files that change on deploy/configuration must never be cached by the browser.
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /appsettings.json { add_header Cache-Control "no-cache"; }
    location = /service-worker.js { add_header Cache-Control "no-cache"; }
    location = /service-worker-assets.js { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }

    # Model files of the on-device assistant (docker compose --profile assistant up): never the app shell fallback, cached long.
    location /models/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Fingerprinted framework files can be cached forever.
    location /_framework/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
