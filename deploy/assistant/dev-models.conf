# Static server for the on-device assistant's model files during development: the phone app (another origin, e.g.
# http://localhost:5082) loads them from here, so CORS is open. Not for production: there nginx serves /models itself.
#   docker run --rm -p 5083:80 -v <models dir>:/srv/models:ro -v ./deploy/assistant/dev-models.conf:/etc/nginx/conf.d/default.conf:ro nginx:1.29-alpine
server {
    listen 80;
    root /srv;
    add_header Access-Control-Allow-Origin "*" always;
    default_type application/octet-stream;
    types { application/wasm wasm; application/json json; }
}
