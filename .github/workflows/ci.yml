name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Kamada.slnx

      - name: Build
        run: dotnet build Kamada.slnx -c Release --no-restore

      # Integration tests start PostgreSQL via Testcontainers (Docker is available on ubuntu runners).
      - name: Test
        run: dotnet test --solution Kamada.slnx -c Release --no-build

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build images
        run: docker compose build
